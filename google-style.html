<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book with Trey | Success Academy</title>
    
    <!-- Google Fonts exactly matching Google's UI -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Exact Google Colors */
            --google-blue: #1a73e8;
            --google-grey: #5f6368;
            --google-border: #dadce0;
            --google-hover: #f1f3f4;
            --google-active-blue: #e8f0fe;
            --google-text: #202124;
            
            /* Success Academy Logo Accent */
            --sa-orange: #F7941E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff; /* Pure white background */
            color: var(--google-text);
            font-family: 'Roboto', arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* NO SCROLLING ALLOWED */
        }

        /* --- GOOGLE STYLE HEADER --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            height: 64px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--google-border);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--google-grey);
            transition: background-color 0.2s;
        }

        .menu-icon:hover {
            background-color: rgba(60,64,67,0.08);
        }

        .menu-icon svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Google Sans', arial, sans-serif;
            font-size: 22px;
            color: var(--google-grey);
            text-decoration: none;
        }
        
        .brand-logo .sa-text {
            color: var(--google-grey);
            font-weight: 400;
        }
        
        /* Subtle SA accent dot instead of full colored logo */
        .sa-dot {
            width: 8px;
            height: 8px;
            background-color: var(--sa-orange);
            border-radius: 50%;
            display: inline-block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--google-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Google Sans', arial, sans-serif;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }

        /* --- MAIN CONTENT --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(100vh - 64px);
            background-color: #ffffff;
        }

        /* Custom top section that mimics the Google Calendar booking header */
        .booking-header-wrapper {
            display: flex;
            justify-content: center;
            padding: 32px 24px 0 24px;
            background-color: #ffffff;
            flex-shrink: 0;
        }

        .booking-header-content {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 24px;
        }

        .title-section h1 {
            font-family: 'Google Sans', arial, sans-serif;
            font-size: 28px;
            font-weight: 400;
            color: var(--google-text);
            margin-bottom: 8px;
        }

        .title-section p {
            font-size: 14px;
            color: var(--google-grey);
        }

        /* Exact Google UI Pill Buttons */
        .duration-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
        }

        .duration-btn {
            background: #ffffff;
            border: 1px solid var(--google-border);
            border-radius: 16px;
            padding: 6px 16px;
            font-family: 'Google Sans', arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--google-grey);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .duration-btn:hover {
            background-color: var(--google-hover);
        }

        .duration-btn.active {
            background-color: var(--google-active-blue);
            color: var(--google-blue);
            border-color: transparent;
        }

        /* --- SEAMLESS IFRAME --- */
        /* 
           The Google Calendar iframe has its own margins/headers.
           To make it seamless, we let it fill the remaining space exactly.
        */
        .calendar-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            background-color: #ffffff;
        }

        /* We constrain the iframe width so it matches the header */
        .calendar-iframe-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1000px; /* Google's standard centered max-width */
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            /* Negative margin trick to hide Google's internal padding if desired, 
               but native iframe looks best if we just let it render full size */
        }

        /* Google Material Spinner */
        .loading-overlay {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .loading-overlay.active {
            opacity: 1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--google-hover);
            border-top: 4px solid var(--google-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Google Workspace Style Header -->
    <header>
        <div class="header-left">
            <div class="menu-icon" title="Main menu">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </div>
            <a href="#" class="brand-logo">
                <span class="sa-dot"></span>
                <span class="sa-text">Success Academy</span>
            </a>
        </div>
        <div class="header-right">
            <div class="menu-icon" title="Google apps">
                <svg viewBox="0 0 24 24"><path d="M6,8c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S4.9,8 6,8zM6,14c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S4.9,14 6,14zM6,20c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S4.9,20 6,20zM12,8c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S10.9,8 12,8zM12,14c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S10.9,14 12,14zM12,20c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S10.9,20 12,20zM18,8c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S16.9,8 18,8zM18,14c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S16.9,14 18,14zM18,20c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S16.9,20 18,20z"/></svg>
            </div>
            <div class="profile-avatar" title="Trey Feldman">
                TF
            </div>
        </div>
    </header>

    <main>
        <!-- Custom top section to control durations exactly like Google -->
        <div class="booking-header-wrapper">
            <div class="booking-header-content">
                <div class="title-section">
                    <h1>Book an appointment</h1>
                    <p>Select a time to meet with Trey Feldman</p>
                </div>
                
                <div class="duration-selector">
                    <button class="duration-btn" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0I-Zl9F8XEN-aSFW6Exph-jst-9yMMwbEGoyYQH0yKJh4P95Xa3UFwohtAM3iOoBNpabXyPi0C?gv=true">
                        15 min
                    </button>
                    <button class="duration-btn active" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true">
                        30 min
                    </button>
                    <button class="duration-btn" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1GgmXp1kslcwHCAENqOeCN6qs5nG9fGZnbdEVz8fIBpK4E2Uvi-9SQCzN-w5tNe8BeTs77cHhF?gv=true">
                        60 min
                    </button>
                </div>
            </div>
        </div>

        <!-- The Calendar purely taking up the rest of the space -->
        <div class="calendar-container" id="calContainer">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
            </div>
            <div class="calendar-iframe-wrapper">
                <!-- Note: The Google Calendar embed has its own padding built into the iframe. 
                     By removing borders and using pure white, it blends exactly into our page -->
                <iframe id="calendarFrame" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true" frameborder="0"></iframe>
            </div>
        </div>
    </main>

    <script>
        const buttons = document.querySelectorAll('.duration-btn');
        const iframe = document.getElementById('calendarFrame');
        const overlay = document.getElementById('loadingOverlay');

        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('active')) return;

                const url = this.getAttribute('data-url');

                // Google style active state toggle
                buttons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Native Google blue spinner
                overlay.classList.add('active');
                iframe.style.opacity = '0.5';
                
                // Switch iframe
                setTimeout(() => {
                    iframe.src = url;
                }, 100);

                setTimeout(() => {
                    overlay.classList.remove('active');
                    iframe.style.opacity = '1';
                }, 800);
            });
        });
    </script>
</body>
</html>
