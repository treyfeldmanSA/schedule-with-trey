<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book with Trey | Success Academy</title>
    
    <!-- Google Fonts for Material Design 3 Typography -->
    <!-- Outfit closely resembles Google's proprietary 'Product Sans' font used in headers -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Google Material Design 3 Color Palette */
            --md-sys-color-primary: #0b57d0; /* Google Blue */
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #d3e3fd; /* Light blue selection background */
            --md-sys-color-on-primary-container: #041e49;
            
            --md-sys-color-secondary: #444746;
            --md-sys-color-surface: #ffffff;
            --md-sys-color-on-surface: #1f1f1f;
            --md-sys-color-on-surface-variant: #444746;
            --md-sys-color-outline: #747775;
            --md-sys-color-outline-variant: #c4c7c5;
            
            /* Success Academy accent */
            --sa-orange: #F7941E;

            /* Typography */
            --font-display: 'Outfit', 'Google Sans', 'Segoe UI', sans-serif; /* For headers */
            --font-body: 'Roboto', 'Segoe UI', sans-serif; /* For body text and buttons */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top App Bar mimicking Google Workspace */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            height: 64px;
            background-color: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--md-sys-color-on-surface-variant);
            transition: background-color 0.2s;
        }

        .menu-icon:hover {
            background-color: rgba(68, 71, 70, 0.08);
        }

        .menu-icon svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            text-decoration: none;
        }
        
        .brand-logo .sa-text {
            color: var(--md-sys-color-on-surface);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--sa-orange);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 0 1px var(--md-sys-color-outline-variant);
        }

        /* Main Content Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        /* Page Header */
        .page-header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
            max-width: 700px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 36px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--md-sys-color-secondary);
        }

        /* Material 3 Segmented Button for Duration */
        .duration-selector-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px; /* Reduced to bring calendar closer */
            width: 100%;
        }

        .duration-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 12px;
        }

        .segmented-buttons {
            display: flex;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 100px;
            overflow: hidden;
            background-color: var(--md-sys-color-surface);
        }

        .segment-btn {
            background: transparent;
            border: none;
            padding: 10px 24px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .segment-btn:not(:last-child) {
            border-right: 1px solid var(--md-sys-color-outline);
        }

        .segment-btn:hover:not(.active) {
            background-color: rgba(68, 71, 70, 0.08);
        }

        .segment-btn.active {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        /* Active checkmark SVG */
        .segment-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            display: none;
        }

        .segment-btn.active svg {
            display: block;
        }

        /* Seamless Iframe Container */
        .calendar-container {
            width: 100%;
            position: relative;
            /* Match the Google Calendar embedded background so it's a seamless extension */
            background-color: var(--md-sys-color-surface);
            height: 700px;
            transition: opacity 0.3s ease;
        }

        .calendar-container.loading {
            opacity: 0.5;
        }

        .calendar-iframe-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Material Circular Progress Loader */
        .loading-overlay {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .loading-overlay.active {
            opacity: 1;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--md-sys-color-primary-container);
            border-top: 4px solid var(--md-sys-color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 14px;
            color: var(--md-sys-color-primary);
            font-weight: 500;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }
            .segmented-buttons {
                width: 100%;
            }
            .segment-btn {
                flex: 1;
                justify-content: center;
                padding: 10px 8px;
            }
            .segment-btn svg {
                display: none !important; /* Hide checkmark on mobile to save space */
            }
        }
    </style>
</head>
<body>

    <!-- Google Workspace Style Header -->
    <header>
        <div class="header-left">
            <div class="menu-icon" title="Main menu">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </div>
            <a href="#" class="brand-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Google_Calendar_icon_%282020%29.svg/512px-Google_Calendar_icon_%282020%29.svg.png" alt="Calendar" style="width: 32px; height: 32px;">
                <span class="sa-text">Success Academy</span>
            </a>
        </div>
        <div class="header-right">
            <div class="menu-icon" title="Help">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-1.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
            </div>
            <div class="profile-avatar" title="Trey Feldman">
                TF
            </div>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1>Book an appointment</h1>
            <p class="subtitle">Select a time to meet with Trey Feldman</p>
        </div>

        <div class="duration-selector-container">
            <div class="duration-label">Select duration</div>
            
            <div class="segmented-buttons">
                <button class="segment-btn" data-time="15" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0I-Zl9F8XEN-aSFW6Exph-jst-9yMMwbEGoyYQH0yKJh4P95Xa3UFwohtAM3iOoBNpabXyPi0C?gv=true">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    15 min
                </button>
                <button class="segment-btn active" data-time="30" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    30 min
                </button>
                <button class="segment-btn" data-time="60" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1GgmXp1kslcwHCAENqOeCN6qs5nG9fGZnbdEVz8fIBpK4E2Uvi-9SQCzN-w5tNe8BeTs77cHhF?gv=true">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    60 min
                </button>
            </div>
        </div>

        <div class="calendar-container" id="calContainer">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div class="loading-text">Loading times...</div>
            </div>
            <div class="calendar-iframe-wrapper">
                <iframe id="calendarFrame" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true" frameborder="0"></iframe>
            </div>
        </div>
    </main>

    <script>
        const buttons = document.querySelectorAll('.segment-btn');
        const iframe = document.getElementById('calendarFrame');
        const calContainer = document.getElementById('calContainer');
        const overlay = document.getElementById('loadingOverlay');

        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('active')) return;

                const url = this.getAttribute('data-url');

                // Update active state
                buttons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Show Material loading spinner
                overlay.classList.add('active');
                calContainer.classList.add('loading');
                
                // Change the iframe source after a tiny delay
                setTimeout(() => {
                    iframe.src = url;
                }, 200);

                // Hide loading after a bit
                setTimeout(() => {
                    overlay.classList.remove('active');
                    calContainer.classList.remove('loading');
                }, 1200);
            });
        });
    </script>
</body>
</html>
