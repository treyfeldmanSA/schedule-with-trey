<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book with Trey | Success Academy</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE STRUCTURE: ZERO SCROLLING --- */
        html, body {
            margin: 0; 
            padding: 0;
            width: 100vw; 
            height: 100vh;
            overflow: hidden; /* ABSOLUTELY NO DOUBLE SCROLLBARS */
            background-color: #ffffff;
            font-family: arial, sans-serif; /* Google Search uses standard Arial for UI */
            display: flex;
            flex-direction: column;
        }

        /* --- GOOGLE SEARCH RESULTS HEADER --- */
        .google-header {
            display: flex;
            align-items: center;
            padding: 20px 28px;
            gap: 40px;
            border-bottom: 1px solid #ebebeb;
            flex-shrink: 0; /* Header stays fixed */
            background: #ffffff;
            z-index: 100;
        }

        /* Artsy Google-colored Logo */
        .logo-container {
            font-family: 'Product Sans', 'Google Sans', Roboto, sans-serif;
            font-size: 26px;
            font-weight: 500;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            text-decoration: none;
            white-space: nowrap;
            margin-top: -4px;
        }

        /* Exact Google Colors applied to Success Academy */
        .logo-success span:nth-child(1) { color: #4285F4; } /* Blue */
        .logo-success span:nth-child(2) { color: #EA4335; } /* Red */
        .logo-success span:nth-child(3) { color: #FBBC05; } /* Yellow */
        .logo-success span:nth-child(4) { color: #4285F4; } /* Blue */
        .logo-success span:nth-child(5) { color: #34A853; } /* Green */
        .logo-success span:nth-child(6) { color: #EA4335; } /* Red */
        .logo-success span:nth-child(7) { color: #FBBC05; } /* Yellow */

        .logo-academy {
            color: #5f6368;
            font-size: 24px;
            font-weight: 400;
            margin-left: 6px;
        }

        /* EXACT GOOGLE SEARCH BAR (Duration Selector) */
        .search-bar-dock {
            flex: 1;
            max-width: 690px;
            height: 46px;
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 16px 0 14px;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .search-bar-dock:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,.28), 0 2px 10px rgba(32,33,36,.1);
            border-color: rgba(223,225,229,0);
        }

        .search-icon {
            display: flex;
            align-items: center;
            padding-right: 12px;
        }
        
        .search-icon svg {
            fill: #9aa0a6;
            width: 20px;
            height: 20px;
        }

        .dock-buttons {
            display: flex;
            flex: 1;
            gap: 8px;
            align-items: center;
        }

        /* Buttons acting as "Search Filters" */
        .duration-btn {
            background: transparent;
            border: none;
            font-family: arial, sans-serif;
            font-size: 14px;
            color: #3c4043;
            padding: 8px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        
        .duration-btn:hover {
            background: #f1f3f4;
        }
        
        .duration-btn.active {
            background: #e8f0fe;
            color: #1a73e8;
        }

        .voice-icon, .camera-icon {
            display: flex;
            align-items: center;
            padding-left: 12px;
            cursor: pointer;
        }
        
        .voice-icon svg, .camera-icon svg {
            width: 24px;
            height: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            margin-left: auto;
            gap: 16px;
        }

        .apps-icon {
            display: flex;
            align-items: center;
        }
        .apps-icon svg {
            fill: #5f6368;
            width: 24px;
            height: 24px;
            cursor: pointer;
            transition: fill 0.2s;
        }
        .apps-icon:hover svg {
            fill: #202124;
        }

        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1a73e8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Product Sans', Roboto, sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* --- CALENDAR IFRAME CONTAINER --- */
        .calendar-container {
            flex: 1; /* Takes up ALL remaining space */
            width: 100%;
            position: relative;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- GOOGLE ARTSY ANIMATIONS --- */
        
        /* 1. YouTube/Google style rainbow loading sweep line */
        .loading-line {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 3px;
            background: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853, #4285F4);
            background-size: 200% 100%;
            animation: sweep 1s linear infinite;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .loading-line.active { 
            opacity: 1; 
        }
        
        @keyframes sweep {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* 2. Google Assistant styled bouncing dots overlay */
        .loading-overlay {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .google-dots {
            display: flex;
            gap: 8px;
            margin-top: -10vh; /* Lifted slightly above center to match the visual weight of the calendar */
        }

        .dot {
            width: 14px; 
            height: 14px;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot.blue { background: #4285f4; animation-delay: -0.32s; }
        .dot.red { background: #ea4335; animation-delay: -0.16s; }
        .dot.yellow { background: #fbbc05; animation-delay: -0.08s; }
        .dot.green { background: #34a853; animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Mobile responsiveness */
        @media (max-width: 800px) {
            .google-header {
                padding: 12px 16px;
                gap: 16px;
            }
            .logo-academy { display: none; }
            .voice-icon, .camera-icon { display: none; }
            .apps-icon { display: none; }
        }
    </style>
</head>
<body>

    <!-- EXACT GOOGLE SEARCH RESULTS HEADER -->
    <header class="google-header">
        
        <!-- "Google Artsy" Success Academy Logo -->
        <a href="#" class="logo-container">
            <div class="logo-success">
                <span>S</span><span>u</span><span>c</span><span>c</span><span>e</span><span>s</span><span>s</span>
            </div>
            <div class="logo-academy">Academy</div>
        </a>
        
        <!-- The Google Search Bar (functioning as the duration selector) -->
        <div class="search-bar-dock">
            <div class="search-icon">
                <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            </div>
            
            <div class="dock-buttons">
                <button class="duration-btn" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0I-Zl9F8XEN-aSFW6Exph-jst-9yMMwbEGoyYQH0yKJh4P95Xa3UFwohtAM3iOoBNpabXyPi0C?gv=true">
                    15 min
                </button>
                <button class="duration-btn active" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true">
                    30 min
                </button>
                <button class="duration-btn" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1GgmXp1kslcwHCAENqOeCN6qs5nG9fGZnbdEVz8fIBpK4E2Uvi-9SQCzN-w5tNe8BeTs77cHhF?gv=true">
                    60 min
                </button>
            </div>

            <!-- Authentic Google Voice Icon -->
            <div class="voice-icon" title="Search by voice">
                <svg focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"></path><path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path><path fill="#fbbc05" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"></path><path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"></path></svg>
            </div>
            <!-- Authentic Google Lens/Camera Icon -->
            <div class="camera-icon" title="Search by image">
                <svg class="Gdd5U" focusable="false" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg"><rect fill="none" height="192" width="192"></rect><g><circle cx="144" cy="144" fill="#34a853" r="16"></circle><circle cx="96" cy="96" fill="#ea4335" r="24"></circle><path d="M124,48H106.59l-11.47-12H96V64h38.39A23.94,23.94,0,0,1,160,86.29V112h16V86.29A39.92,39.92,0,0,0,138.65,48Z" fill="#fbbc04"></path><path d="M68,48H48A40,40,0,0,0,8,88v48H24V88A24,24,0,0,1,48,64H88V36L76.59,48Z" fill="#4285f4"></path><path d="M8,140H24v28A24,24,0,0,0,48,192H88V176H48A40,40,0,0,1,8,136Z" fill="#34a853"></path></g></svg>
            </div>
        </div>

        <div class="header-right">
            <!-- Authentic Google Apps Grid Icon -->
            <div class="apps-icon" title="Google apps">
                <svg viewBox="0 0 24 24"><path d="M6,8c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S4.9,8 6,8zM6,14c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S4.9,14 6,14zM6,20c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S4.9,20 6,20zM12,8c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S10.9,8 12,8zM12,14c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S10.9,14 12,14zM12,20c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S10.9,20 12,20zM18,8c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S16.9,8 18,8zM18,14c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S16.9,14 18,14zM18,20c1.1,0 2-0.9 2-2s-0.9-2 -2-2s-2,0.9 -2,2S16.9,20 18,20z"/></svg>
            </div>
            <div class="profile-avatar" title="Trey Feldman">
                TF
            </div>
        </div>
    </header>

    <!-- CALENDAR FILLING THE REMAINDER OF THE SCREEN -->
    <main class="calendar-container" id="calContainer">
        
        <!-- Google Rainbow Loading Line -->
        <div class="loading-line" id="loadingLine"></div>
        
        <!-- Google Assistant Bouncing Dots Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="google-dots">
                <div class="dot blue"></div>
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
        </div>
        
        <iframe id="calendarFrame" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true" frameborder="0"></iframe>
    
    </main>

    <script>
        const buttons = document.querySelectorAll('.duration-btn');
        const iframe = document.getElementById('calendarFrame');
        const overlay = document.getElementById('loadingOverlay');
        const loadingLine = document.getElementById('loadingLine');

        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('active')) return;

                const url = this.getAttribute('data-url');

                // Update active states
                buttons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Trigger the beautiful Google artsy animations
                overlay.classList.add('active');
                loadingLine.classList.add('active');
                
                // Change the iframe source after a tiny delay
                setTimeout(() => {
                    iframe.src = url;
                }, 100);

                // Smoothly fade out the loaders
                setTimeout(() => {
                    overlay.classList.remove('active');
                    loadingLine.classList.remove('active');
                }, 1200);
            });
        });
    </script>
</body>
</html>
