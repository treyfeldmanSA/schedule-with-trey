<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session | Success Academy</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Fonts for authentic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE BASE --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* NO SCROLLING */
            background-color: #ffffff;
            font-family: 'Roboto', sans-serif;
            color: #202124;
        }

        /* --- GOOGLE DEVELOPER ART BACKGROUND --- */
        .background-art {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            overflow: hidden;
            background: #ffffff;
            pointer-events: none;
        }

        /* Animated SVG Sweeping Lines */
        .google-lines {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .anim-line {
            stroke-dasharray: 800 1200;
            animation: flowLine 25s linear infinite;
        }
        .blue-line { stroke: #4285F4; animation-duration: 30s; animation-direction: reverse; }
        .red-line { stroke: #EA4335; animation-duration: 25s; }
        .yellow-line { stroke: #FBBC05; animation-duration: 35s; }
        .green-line { stroke: #34A853; animation-duration: 20s; animation-direction: reverse; }
        .blue-line-2 { stroke: #4285F4; animation-duration: 28s; }
        .red-line-2 { stroke: #EA4335; animation-duration: 22s; animation-direction: reverse; }

        @keyframes flowLine {
            from { stroke-dashoffset: 2000; }
            to { stroke-dashoffset: 0; }
        }

        /* Floating Geometric Shapes */
        .shape {
            position: absolute;
            animation: floatShape 20s infinite ease-in-out alternate;
        }
        .circle { border-radius: 50%; }
        .circle.solid.blue { width: 40px; height: 40px; background: #4285F4; }
        .circle.hollow.red { width: 50px; height: 50px; border: 8px solid #EA4335; box-sizing: border-box; }
        .circle.hollow.blue { width: 30px; height: 30px; border: 6px solid #4285F4; box-sizing: border-box; }
        .triangle { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 34px solid #34A853; }
        .plus { width: 40px; height: 10px; background: #FBBC05; position: relative; }
        .plus::after { content: ''; position: absolute; top: -15px; left: 15px; width: 10px; height: 40px; background: #FBBC05; }
        .square.hollow.blue { width: 40px; height: 40px; border: 8px solid #4285F4; box-sizing: border-box; }
        .dot { width: 14px; height: 14px; border-radius: 50%; }
        .dot.red { background: #EA4335; }
        .dot.green { background: #34A853; }
        .dot.yellow { background: #FBBC05; }

        @keyframes floatShape {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            100% { transform: translateY(-80px) rotate(180deg) scale(1.1); }
        }

        /* --- LAYOUT STRUCTURE --- */
        .layout {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* --- LEFT PANEL --- */
        .left-panel {
            flex: 0 0 450px;
            padding: 0 40px 0 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Soft gradient ensures text is perfectly readable over the lines */
            background: linear-gradient(to right, rgba(255,255,255,1) 60%, rgba(255,255,255,0) 100%);
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 80px;
        }
        
        .logo-icon {
            width: 24px;
            height: 24px;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 500;
            color: #5f6368;
            letter-spacing: -0.5px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #202124;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1.5px;
        }
        
        h1 .dot-blue { color: #4285F4; }

        p {
            font-family: 'Roboto', sans-serif;
            font-size: 1.125rem;
            color: #5f6368;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 320px;
        }

        /* Interactive Pill Selector */
        .duration-selector {
            display: inline-flex;
            background: #f1f3f4;
            border-radius: 40px;
            padding: 6px;
            width: max-content;
        }

        .duration-btn {
            padding: 12px 28px;
            border-radius: 34px;
            border: none;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: #5f6368;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .duration-btn:hover {
            color: #202124;
        }

        .duration-btn.active {
            background: #ffffff;
            color: #1a73e8;
            box-shadow: 0 2px 8px rgba(32,33,36,0.12);
        }

        /* --- RIGHT PANEL (SEAMLESS CALENDAR) --- */
        .right-panel {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            position: relative;
            z-index: 5;
        }

        .calendar-wrapper {
            width: 100%;
            max-width: 950px;
            height: 100%;
            background: #ffffff; /* Solid white blocks the background art */
            position: relative;
            /* This shadow is the MAGIC: It casts a pure white soft fade to the left, 
               making the background art seamlessly dissolve into the calendar */
            box-shadow: -80px 0 80px 40px #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: relative;
            z-index: 5;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* Loading Google Dots Overlay */
        .loading-dots {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 8px;
            z-index: 2; /* Sits behind iframe, visible when iframe opacity drops */
            opacity: 0;
            transition: opacity 0.3s;
        }

        .loading-dots.active {
            opacity: 1;
        }

        .loading-dots .dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            animation: googleBounce 1.4s infinite ease-in-out both;
        }
        .loading-dots .blue { background: #4285F4; animation-delay: -0.32s; }
        .loading-dots .red { background: #EA4335; animation-delay: -0.16s; }
        .loading-dots .yellow { background: #FBBC05; animation-delay: -0.08s; }
        .loading-dots .green { background: #34A853; animation-delay: 0s; }

        @keyframes googleBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Mobile */
        @media (max-width: 900px) {
            .layout { flex-direction: column; }
            .left-panel {
                flex: none;
                width: 100%;
                padding: 40px 24px;
                background: linear-gradient(to bottom, rgba(255,255,255,1) 80%, rgba(255,255,255,0) 100%);
            }
            .calendar-wrapper {
                box-shadow: 0 -80px 80px 40px #ffffff;
            }
        }
    </style>
</head>
<body>

    <!-- Google Developer Art Background -->
    <div class="background-art">
        <svg class="google-lines" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
            <path d="M-200,800 C 100,700 400,200 1200,300" fill="none" stroke-width="6" class="anim-line blue-line" />
            <path d="M-200,200 C 200,400 600,900 1200,600" fill="none" stroke-width="10" class="anim-line red-line" />
            <path d="M 300,-200 C 200,300 800,800 600,1200" fill="none" stroke-width="5" class="anim-line yellow-line" />
            <path d="M 800,-200 C 700,200 100,600 300,1200" fill="none" stroke-width="8" class="anim-line green-line" />
            <path d="M-200,500 C 300,600 700,100 1200,200" fill="none" stroke-width="4" class="anim-line blue-line-2" />
            <path d="M 0,1200 C 400,800 500,200 1200,900" fill="none" stroke-width="6" class="anim-line red-line-2" />
        </svg>
        <div class="shapes">
            <div class="shape circle solid blue" style="top: 20%; left: 30%; animation-delay: 0s;"></div>
            <div class="shape circle hollow red" style="top: 70%; left: 10%; animation-delay: -3s;"></div>
            <div class="shape triangle green" style="top: 80%; left: 35%; animation-delay: -7s;"></div>
            <div class="shape plus yellow" style="top: 15%; left: 55%; animation-delay: -2s;"></div>
            <div class="shape square hollow blue" style="top: 45%; left: 45%; animation-delay: -5s;"></div>
            <div class="shape dot red" style="top: 50%; left: 20%; animation-delay: -1s;"></div>
            <div class="shape dot green" style="top: 30%; left: 10%; animation-delay: -4s;"></div>
            <div class="shape dot yellow" style="top: 85%; left: 25%; animation-delay: -6s;"></div>
        </div>
    </div>

    <!-- UI Layout -->
    <div class="layout">
        <div class="left-panel">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 2 L22 20 H2 Z" fill="#4285F4" opacity="0.9"/>
                    <circle cx="12" cy="14" r="6" fill="#FBBC05" opacity="0.9"/>
                    <path d="M12 22 L2 4 H22 Z" fill="#EA4335" opacity="0.7"/>
                </svg>
                <span class="logo-text">Success Academy</span>
            </div>
            
            <h1>Book a session<span class="dot-blue">.</span></h1>
            <p>Select your desired duration below. The calendar instantly updates to show available times.</p>
            
            <div class="duration-selector">
                <button class="duration-btn" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0I-Zl9F8XEN-aSFW6Exph-jst-9yMMwbEGoyYQH0yKJh4P95Xa3UFwohtAM3iOoBNpabXyPi0C?gv=true">15 Min</button>
                <button class="duration-btn active" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true">30 Min</button>
                <button class="duration-btn" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1GgmXp1kslcwHCAENqOeCN6qs5nG9fGZnbdEVz8fIBpK4E2Uvi-9SQCzN-w5tNe8BeTs77cHhF?gv=true">60 Min</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="calendar-wrapper">
                <div class="loading-dots" id="loadingDots">
                    <div class="dot blue"></div>
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <iframe id="calendarFrame" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true"></iframe>
            </div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.duration-btn');
        const iframe = document.getElementById('calendarFrame');
        const loadingDots = document.getElementById('loadingDots');

        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('active')) return;

                const url = this.getAttribute('data-url');

                // Update UI state
                buttons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Show Google bouncing dots
                iframe.style.opacity = '0';
                loadingDots.classList.add('active');
                
                // Load new calendar
                setTimeout(() => {
                    iframe.src = url;
                }, 300);

                // Reveal seamless calendar
                setTimeout(() => {
                    iframe.style.opacity = '1';
                    loadingDots.classList.remove('active');
                }, 1200);
            });
        });
    </script>
</body>
</html>
