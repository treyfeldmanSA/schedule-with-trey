<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TREY FELDMAN // SCHEDULING</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Retro 80s Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Righteous&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Success Academy Brand Colors - Neonified for the 80s */
            --sa-orange: #F7941E;
            --sa-navy: #005E9E;
            --sa-yellow: #EDC211;
            --sa-lightblue: #6ACDF4;
            
            --bg-color: #050510;
            --grid-color: var(--sa-navy);
            --glow-orange: 0 0 10px #F7941E, 0 0 20px #F7941E, 0 0 40px #F7941E;
            --glow-blue: 0 0 10px var(--sa-lightblue), 0 0 20px var(--sa-lightblue), 0 0 40px var(--sa-lightblue);
            --glow-yellow: 0 0 10px var(--sa-yellow), 0 0 20px var(--sa-yellow), 0 0 40px var(--sa-yellow);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Righteous', cursive;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* CRT Screen Scanlines */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* 80s Synthwave Grid Background */
        .grid-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60vh;
            perspective: 600px;
            z-index: -1;
            overflow: hidden;
        }

        .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            bottom: -50%;
            left: -50%;
            background-image: 
                linear-gradient(to right, rgba(106, 205, 244, 0.3) 1px, transparent 1px),
                linear-gradient(to top, rgba(106, 205, 244, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(75deg);
            animation: moveGrid 15s linear infinite;
            border-top: 2px solid var(--sa-lightblue);
            box-shadow: 0 -10px 30px rgba(106, 205, 244, 0.5);
        }

        @keyframes moveGrid {
            0% { transform: rotateX(75deg) translateY(0); }
            100% { transform: rotateX(75deg) translateY(50px); }
        }

        /* Glowing Sun/Horizon */
        .sun {
            position: fixed;
            bottom: 30vh;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: linear-gradient(to bottom, var(--sa-yellow), var(--sa-orange));
            border-radius: 50%;
            z-index: -2;
            box-shadow: 0 0 100px var(--sa-orange);
            /* Sliced sun effect */
            mask-image: linear-gradient(to bottom, black 50%, transparent 50%, transparent 55%, black 55%, black 65%, transparent 65%, transparent 72%, black 72%, black 82%, transparent 82%, transparent 92%, black 92%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 50%, transparent 55%, black 55%, black 65%, transparent 65%, transparent 72%, black 72%, black 82%, transparent 82%, transparent 92%, black 92%);
        }

        /* Main Content Container */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title with Glitch & Neon Effects */
        .title-container {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .title-top {
            font-family: 'Bungee Shade', cursive;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--sa-yellow);
            text-shadow: var(--glow-orange);
            letter-spacing: 5px;
            margin-bottom: -10px;
            transform: skew(-10deg);
        }

        .title-bottom {
            font-family: 'Righteous', cursive;
            font-size: clamp(2.5rem, 6vw, 5rem);
            color: transparent;
            -webkit-text-stroke: 2px var(--sa-lightblue);
            text-shadow: 0 0 8px var(--sa-lightblue), 0 0 40px var(--sa-lightblue);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            transition: all 0.3s ease;
            cursor: default;
        }

        .title-bottom::before {
            content: "BOOK WITH TREY";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: var(--sa-lightblue);
            -webkit-text-stroke: 0;
            z-index: -1;
            filter: blur(12px);
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        /* Brighten effect on hover */
        .title-bottom:hover {
            color: #fff;
            -webkit-text-stroke: 0;
            text-shadow: 0 0 5px #fff, 0 0 15px var(--sa-lightblue);
            transform: scale(1.01);
        }
        
        .title-bottom:hover::before {
            opacity: 1;
            filter: blur(12px);
        }

        .subtitle {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: #fff;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: rgba(0, 94, 158, 0.5);
            padding: 5px 20px;
            border: 1px solid var(--sa-lightblue);
            box-shadow: 0 0 10px var(--sa-lightblue);
            margin-bottom: 20px;
            display: inline-block;
        }

        /* Time Selection Buttons */
        .time-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-btn {
            background: rgba(0, 0, 0, 0.6);
            color: var(--sa-lightblue);
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            padding: 10px 30px;
            border: 2px solid var(--sa-lightblue);
            border-radius: 0; /* Sharp corners per brand */
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(106, 205, 244, 0.3);
            text-shadow: 0 0 5px var(--sa-lightblue);
        }

        .time-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .time-btn:hover::before {
            left: 100%;
        }

        .time-btn:hover {
            background: rgba(106, 205, 244, 0.2);
            box-shadow: var(--glow-blue);
            transform: translateY(-2px);
        }

        .time-btn.active {
            background: var(--sa-orange);
            color: #fff;
            border-color: var(--sa-orange);
            box-shadow: var(--glow-orange);
            text-shadow: 0 0 5px #fff;
            animation: pulse-orange 2s infinite;
        }
        
        @keyframes pulse-orange {
            0% { box-shadow: 0 0 10px #F7941E; }
            50% { box-shadow: 0 0 25px #F7941E, 0 0 40px #F7941E; }
            100% { box-shadow: 0 0 10px #F7941E; }
        }

        /* Calendar Container - Glowing Glassmorphism */
        .calendar-container {
            width: 100%;
            background: rgba(5, 5, 16, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--sa-orange);
            border-radius: 0;
            padding: 20px;
            box-shadow: 0 0 20px rgba(247, 148, 30, 0.4), inset 0 0 20px rgba(247, 148, 30, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .calendar-container.loading {
            animation: flicker 0.5s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.8; border-color: var(--sa-yellow); }
            100% { opacity: 1; border-color: var(--sa-orange); }
        }

        .calendar-container:hover {
            box-shadow: 0 0 40px rgba(247, 148, 30, 0.6), inset 0 0 30px rgba(247, 148, 30, 0.3);
            border-color: var(--sa-yellow);
        }

        /* Corner decorations for the container */
        .calendar-container::before, .calendar-container::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid var(--sa-lightblue);
            pointer-events: none;
            z-index: 5;
            transition: all 0.3s ease;
        }

        .calendar-container.active-blue::before,
        .calendar-container.active-blue::after {
            border-color: var(--sa-lightblue);
            box-shadow: var(--glow-blue);
        }
        
        .calendar-container.active-orange::before,
        .calendar-container.active-orange::after {
            border-color: var(--sa-orange);
            box-shadow: var(--glow-orange);
        }
        
        .calendar-container.active-yellow::before,
        .calendar-container.active-yellow::after {
            border-color: var(--sa-yellow);
            box-shadow: var(--glow-yellow);
        }

        .calendar-container::before {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }

        .calendar-container::after {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
        }

        .calendar-iframe-wrapper {
            width: 100%;
            height: 650px;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            transition: opacity 0.3s ease;
        }
        
        /* CRT screen scanline overlay directly over the calendar */
        .calendar-iframe-wrapper::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            z-index: 5;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            /* Hacker dark mode trick: invert the whole iframe, then hue-rotate to bring back the blue colors */
            filter: invert(90%) hue-rotate(180deg) saturate(1.5) contrast(1.1) brightness(1.1);
        }

        /* Loading Overlay for Iframe switching */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--sa-lightblue);
            font-family: 'VT323', monospace;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--sa-yellow);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--sa-yellow);
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Salesforce Clouds */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 55vh; /* Limit clouds to top half above horizon */
            z-index: -3; /* Behind grid and sun */
            pointer-events: none;
            overflow: hidden;
            /* Fade out cleanly as they approach the horizon */
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        }

        .cloud-svg {
            position: absolute;
            fill: #00A1E0; /* Salesforce Blue */
            animation: move-cloud linear infinite;
        }

        @keyframes move-cloud {
            0% { transform: translateX(110vw); }
            100% { transform: translateX(-1000px); }
        }

    </style>
</head>
<body>
    <!-- Retro Background Elements -->
    <div class="clouds" id="clouds"></div>
    <div class="sun"></div>
    <div class="grid-container">
        <div class="grid"></div>
    </div>
    
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <div class="content">
        <div class="title-container">
            <div class="title-top">SUCCESS ACADEMY</div>
            <div class="title-bottom">BOOK WITH TREY</div>
        </div>

        <div class="subtitle" id="status-subtitle">SELECT APPOINTMENT DURATION</div>

        <!-- 80s Arcade Style Duration Selection -->
        <div class="time-selector">
            <button class="time-btn" data-time="15" data-color="blue" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0I-Zl9F8XEN-aSFW6Exph-jst-9yMMwbEGoyYQH0yKJh4P95Xa3UFwohtAM3iOoBNpabXyPi0C?gv=true">
                15 MIN
            </button>
            <button class="time-btn active" data-time="30" data-color="orange" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true">
                30 MIN
            </button>
            <button class="time-btn" data-time="60" data-color="yellow" data-url="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1GgmXp1kslcwHCAENqOeCN6qs5nG9fGZnbdEVz8fIBpK4E2Uvi-9SQCzN-w5tNe8BeTs77cHhF?gv=true">
                60 MIN
            </button>
        </div>

        <div class="calendar-container active-orange" id="calContainer">
            <div class="calendar-iframe-wrapper">
                <div class="loading-overlay" id="loadingOverlay">
                    <span id="loadingText">LOADING CALENDAR...</span>
                </div>
                <!-- Default to 30 min -->
                <iframe id="calendarFrame" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2g_Gq44x_A6rLNj2kRONtMIu2tGLrMjBMH5WfKsopBS9hHYDscMpvL34e9fTZIOKuRvkflvgCc?gv=true" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <script>
        // --- 80s Cyberpunk Particles ---
        const particlesContainer = document.getElementById('particles');
        const colors = ['#F7941E', '#6ACDF4', '#EDC211']; // SA Brand colors

        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 4 + 2;
            const left = Math.random() * 100;
            const duration = Math.random() * 10 + 5;
            const delay = Math.random() * 5;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;
            particle.style.background = color;
            particle.style.boxShadow = `0 0 ${size * 3}px ${color}`;
            
            particlesContainer.appendChild(particle);
        }

        // --- Duration Selection Logic ---
        const buttons = document.querySelectorAll('.time-btn');
        const iframe = document.getElementById('calendarFrame');
        const calContainer = document.getElementById('calContainer');
        const overlay = document.getElementById('loadingOverlay');
        const subtitle = document.getElementById('status-subtitle');
        const loadingText = document.getElementById('loadingText');

        // Professional loading texts
        const loadingTexts = [
            "LOADING CALENDAR...",
            "UPDATING AVAILABILITY...",
            "FETCHING SCHEDULE..."
        ];

        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                // Ignore if already active
                if(this.classList.contains('active')) return;

                const url = this.getAttribute('data-url');
                const time = this.getAttribute('data-time');
                const colorTheme = this.getAttribute('data-color');

                // Update Buttons
                buttons.forEach(b => {
                    b.classList.remove('active');
                    // Reset styling to default
                    b.style.background = '';
                    b.style.borderColor = '';
                    b.style.boxShadow = '';
                    b.style.animation = '';
                });

                // Set new active button styles based on color theme
                this.classList.add('active');
                
                // Set theme colors to match brand guidelines
                let themeHex = '';
                if(colorTheme === 'blue') themeHex = '#6ACDF4';
                if(colorTheme === 'orange') themeHex = '#F7941E';
                if(colorTheme === 'yellow') themeHex = '#EDC211';

                this.style.background = themeHex;
                this.style.borderColor = themeHex;
                this.style.boxShadow = `0 0 10px ${themeHex}, 0 0 20px ${themeHex}`;
                
                // Update Container Theme
                calContainer.className = `calendar-container active-${colorTheme}`;
                calContainer.style.borderColor = themeHex;

                // Update Status Text
                subtitle.innerText = `DURATION: ${time} MINUTES`;

                // Show loading overlay
                overlay.classList.add('active');
                calContainer.classList.add('loading');
                loadingText.innerText = loadingTexts[Math.floor(Math.random() * loadingTexts.length)];
                
                // Change the iframe source
                setTimeout(() => {
                    iframe.src = url;
                }, 400); // Slight delay so the user sees the overlay transition

                // Hide loading after a bit
                setTimeout(() => {
                    overlay.classList.remove('active');
                    calContainer.classList.remove('loading');
                }, 1500);
            });
        });

        // --- Salesforce Blue & SA Orange Clouds ---
        const cloudsContainer = document.getElementById('clouds');
        const numClouds = 4; // Drastically reduced for a clean, sparse sky
        
        // Much better looking, fluffy cloud SVG path
        const cloudPath = 'M182.093 141.401C189.016 134.231 198.659 129.698 209.291 129.698C223.467 129.698 235.747 137.61 242.341 149.313C248.027 146.758 254.374 145.357 261.049 145.357C286.599 145.357 307.203 166.209 307.203 191.923C307.203 217.637 286.516 238.489 261.049 238.489C257.918 238.489 254.868 238.159 251.984 237.582C246.214 247.885 235.17 254.89 222.478 254.89C217.203 254.89 212.176 253.654 207.725 251.511C201.874 265.275 188.192 275 172.286 275C155.72 275 141.544 264.533 136.104 249.78C133.714 250.275 131.242 250.522 128.769 250.522C108.989 250.522 93 234.368 93 214.341C93 200.989 100.17 189.286 110.885 183.022C108.659 177.995 107.423 172.39 107.423 166.456C107.341 143.626 126.049 125 148.962 125C162.478 125 174.511 131.429 182.093 141.401';

        for (let i = 0; i < numClouds; i++) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            // Updated viewBox to match the new coordinates
            svg.setAttribute("viewBox", "0 0 400 400");
            svg.classList.add('cloud-svg');
            
            // With only 4 clouds, guarantee 1 is always SA Orange (the last one)
            if (i === numClouds - 1) {
                svg.style.fill = '#F7941E'; 
            }
            
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", cloudPath);
            svg.appendChild(path);
            
            // Make all clouds larger in general
            const size = Math.random() * 600 + 300; // 300px to 900px wide
            const top = Math.random() * 45; // Top 45% of the screen
            
            // 3D Parallax Effect:
            // Drastic speed differences to ensure it's obvious they are moving at different paces
            // Base duration tied to size: Size 300px -> ~200s duration. Size 900px -> ~30s duration.
            const baseDuration = 200 - ((size - 300) / 600) * 170; 
            
            // Ensure NO TWO CLOUDS move at the same pace by adding a completely random variance (+/- 25 seconds)
            const durationVariance = (Math.random() * 50) - 25;
            const duration = Math.max(20, baseDuration + durationVariance); // Floor at 20s so they don't zoom past too fast
            
            // Depth effect: smaller clouds in the background are slightly more faded
            const baseOpacity = 0.15 + ((size - 300) / 600) * 0.5;
            const opacityVariance = (Math.random() * 0.15) - 0.075;
            const opacity = Math.min(0.65, Math.max(0.1, baseOpacity + opacityVariance));
            
            // Spread evenly across a massive timeline so they don't clump
            const delay = Math.random() * -250; 
            
            svg.style.width = `${size}px`;
            svg.style.height = `${size}px`;
            svg.style.top = `${top}%`;
            svg.style.opacity = opacity;
            svg.style.animationDuration = `${duration}s`;
            svg.style.animationDelay = `${delay}s`;
            
            // Parallax z-index: larger clouds in front, smaller in back
            // Base z-index is -3. Let's stack them based on size.
            svg.style.zIndex = Math.floor(size / 50) - 10; 
            
            cloudsContainer.appendChild(svg);
        }
    </script>
</body>
</html>
